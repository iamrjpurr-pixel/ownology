<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Cache-busting for the HTML shell only. Vite already hashes every JS/CSS
         chunk filename (e.g. index-abc123.js) so those are cached forever safely.
         The problem was stale index.html referencing dead chunk names after a
         deploy — hence Rich's "cascade animation missing on prod" bug.
         Meta-http-equiv is unreliable in modern browsers (kept as belt), the real
         teeth are the HTTP headers set in server/index.ts. Feb 2026. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="app-build" content="__BUILD_ID__" />

    <title>Ownology — Cellar Intelligence for Boutique Winemakers</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a1512" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ownology" />
    <meta name="description" content="Cellar intelligence for boutique winemakers. Daily 5:30am Cellar Brief, 236 winemaker Q&As grounded in industry-standard oenology references, one-tap Wine Australia LIP Audit Pack PDF. 14-day free trial." />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ownology" />
    <meta property="og:title" content="Ownology — Cellar Intelligence for Boutique Winemakers" />
    <meta property="og:description" content="Daily 5:30am Cellar Brief. 236 winemaker Q&As grounded in industry-standard oenology references. One-tap Wine Australia LIP Audit Pack. 14-day free trial." />
    <meta property="og:url" content="https://ownology.ai/" />
    <meta property="og:image" content="https://ownology.ai/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ownology — Cellar intelligence for boutique winemakers" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ownology — Cellar Intelligence for Boutique Winemakers" />
    <meta name="twitter:description" content="Daily 5:30am Cellar Brief. 236 winemaker Q&As. One-tap LIP Audit Pack PDF. 14-day free trial." />
    <meta name="twitter:image" content="https://ownology.ai/og-image.png" />

    <link rel="canonical" href="https://ownology.ai/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,400&family=Lato:wght@300;400;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      Umami analytics — enable by (1) setting VITE_ANALYTICS_ENDPOINT and
      VITE_ANALYTICS_WEBSITE_ID at build time, and (2) uncommenting below.
      Left commented so unconfigured builds don't 400 on a placeholder URL.

      <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami"
        data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
    -->
  </body>
</html>
