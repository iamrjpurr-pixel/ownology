    sources_private: [aoc_1_9_harvesting_selling, morewine_bible_red_ch6]
    sources_public_ref: [adelaide_oenology_3047wt, adelaide_viticult_3044wt]
    citations_bibliographic: [jackson_wine_science_ch4]

  - id: L2.5
    slug: crushing-must-preparation
    title: "Crushing, destemming, must handling"
    level: 2
    wbs: [D3]
    reading_min: 4
    aim: >
      Whole bunch vs destemmed, crush vs no crush, SO₂ additions, cold
