# Ownology Curriculum Spine — Vigneron Tier
#
# Strategy: Ownology's edge is CURATION + APPLICATION, not raw content.
# Every lesson pairs a synthesised aim (from private-grounding sources)
# with an APPLICATION angle that lands the concept on the user's own
# cellar decisions this week.
#
# Structure spine: Adelaide 068885G Level 1 → Level 4
# Voice spine:     AOC "Lesson Aim" clarity, tightened + made practical
# Depth spine:     MoreWine + AWRI + academic references (private grounding)
# Application:     Vigneron-tier — ties into user's vintage log, tanks, region
#
# Access: Vigneron tier only (top subscription).
# Anonymous users see title + aim; the body, application, and citation strip
# are gated. This is deliberate — the education layer is a conversion moat.

version: 1
tier_gate: "vigneron"
levels:
  - id: 1
    label: "Foundations"
    tagline: "The science and language every serious winemaker shares"
  - id: 2
    label: "Grape to Ferment"
    tagline: "Season-by-season decisions from vineyard to must"
  - id: 3
    label: "Cellar Craft"
    tagline: "The critical calls between ferment and blend"
  - id: 4
    label: "Finishing & Reflection"
    tagline: "How wine leaves the cellar — and how you learn from it"

wbs_domains:
  D1: Vineyard
  D2: Harvest
  D3: Crushing & Ferment
  D4: Fermentation
  D5: Post-Ferment
  D6: Stabilisation
  D7: Packaging
  D8: Sensory
  D9: Maintenance
  D10: Compliance

lessons:
  # ─────────────────────────────────────────────────────
  # LEVEL 1 · FOUNDATIONS (6 lessons)
  # ─────────────────────────────────────────────────────
  - id: L1.1
    slug: global-viticulture-context
    title: "Where wine happens — AU/NZ in the global map"
    level: 1
    wbs: [D1]
    reading_min: 3
    aim: >
      Locate the AU and NZ wine industries in a global context, and understand
      why our climate and regulatory setting shapes every downstream choice.
    application: >
      When you're deciding blending targets, harvest timing, or export
      compliance, you're implicitly answering "what wine is my region
      allowed to make?". This lesson makes that context explicit.
    sources_private: [morewine_bible_red_ch1, aoc_1_1_viticulture]
    sources_public_ref: [adelaide_oenology_1018nw, csu_wsc111]
    citations_bibliographic: [robinson_oxford_intro]

  - id: L1.2
    slug: vine-biology-essentials
    title: "The vine — the biology every winemaker needs"
    level: 1
    wbs: [D1]
    reading_min: 4
    aim: >
      Understand grapevine anatomy, phenology, and berry maturation as the
      chain that ends in your press. No morphology quiz — just what changes
      when the vine changes.
    application: >
      Your ripeness calls make sense when you can name what's happening in
      the berry during veraison. This lesson underwrites every harvest
      decision Owen will help you make.
    sources_private: [aoc_1_5_grapevine_culture_a, morewine_bible_red_ch2]
    sources_public_ref: [lincoln_wine_201, adelaide_viticult_2500wt]
    citations_bibliographic: [coombe_iland_visc_vol1]

  - id: L1.3
    slug: climate-soils-terroir
    title: "Climate, soils and the terroir you actually have"
    level: 1
    wbs: [D1]
    reading_min: 4
    aim: >
      Read your climate zone and soil profile as inputs to wine style — not
      as marketing language.
    application: >
      Your regional GI, your MJT, your soil water-holding capacity — Owen
      pulls all three from your vineyard block record and shows what wines
      that combination naturally makes.
    sources_private: [aoc_1_2_climate_soils]
    sources_public_ref: [adelaide_viticult_2500wt]
    citations_bibliographic: [coombe_iland_visc_vol1_ch_resources]

  - id: L1.4
    slug: wine-chemistry-fundamentals
    title: "The four numbers that run everything"
    level: 1
    wbs: [D3, D4, D6]
    reading_min: 5
    aim: >
      pH, TA, alcohol, free SO₂ — what each one is, why the others matter
      when you touch one, and what changes them in a tank.
    application: >
      These are the four numbers Owen watches on every tank. This lesson
      lets you read them like the vintage log they are.
    sources_private: [morewine_bible_red_ch3, morew_ph_meter, morew_so2_mgmt]
    sources_public_ref: [csu_wsc115, csu_wsc319]
    citations_bibliographic: [boulton_ppw_ch1, waterhouse_sacks_ch1]

  - id: L1.5
    slug: fermentation-fundamentals
    title: "What fermentation actually is"
    level: 1
    wbs: [D4]
    reading_min: 5
    aim: >
      Sugar → alcohol → CO₂ + heat + everything else. The biochemistry made
      operational — what changes and when.
    application: >
      When your ferment stalls or spikes, this lesson is the mental model
      you're troubleshooting against.
    sources_private: [morewine_bible_red_ch4, awri_stuck_ferment]
    sources_public_ref: [csu_wsc115, adelaide_oenology_2503wt]
    citations_bibliographic: [boulton_ppw_ch4]

  - id: L1.6
    slug: winemakers-toolkit
    title: "Your toolkit — from home-scale to boutique"
    level: 1
    wbs: [D3, D5, D9]
    reading_min: 4
    aim: >
      Match equipment to scale honestly. What a 50L test tank teaches you
      that a 5000L tank cannot, and vice versa.
    application: >
      Owen tracks your kit register. This lesson lets you audit whether your
      kit is the constraint on your quality, or your process is.
    sources_private: [morewine_bible_red_ch5, aoc_2_1_intro_oenology]
    sources_public_ref: [csu_wsc321, adelaide_oenology_3530wt]
    citations_bibliographic: [jackson_wine_science_ch12]

  # ─────────────────────────────────────────────────────
  # LEVEL 2 · GRAPE TO FERMENT (8 lessons)
  # ─────────────────────────────────────────────────────
  - id: L2.1
    slug: variety-selection
    title: "Picking varieties for the wine you want to make"
    level: 2
    wbs: [D1]
    reading_min: 4
    aim: >
      Match variety, rootstock, and clone to site, climate, and target
      wine style. What the Aussie/NZ industry has learned about the
      classics — and about the newer players.
    application: >
      When you're planning a replant, or interpreting a fruit contract,
      this lesson gives you the questions to ask before the bud burst.
    sources_private: [aoc_1_3_selecting_grape_varieties]
    sources_public_ref: [adelaide_viticult_2500wt, csu_vit212]
    citations_bibliographic: [robinson_oxford_varieties]

  - id: L2.2
    slug: vineyard-establishment
    title: "Vineyard establishment — the calls that lock in decades"
    level: 2
    wbs: [D1]
    reading_min: 4
    aim: >
      Row orientation, spacing, trellis, irrigation, soil prep — the
      decisions you make at planting that you'll live with for 25 years.
    application: >
      Owen captures your vineyard block schema for downstream yield/quality
