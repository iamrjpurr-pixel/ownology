    sources_private: [morew_oxygen_ferment, awri_stuck_ferment, aoc_2_2_fermentation_science]
    sources_public_ref: [csu_wsc115, adelaide_oenology_3046wt]
    citations_bibliographic: [boulton_ppw_ch4]

  - id: L2.8
    slug: malolactic-fermentation
    title: "Malolactic — the second ferment that changes the wine"
    level: 2
    wbs: [D4, D5]
    reading_min: 4
    aim: >
      When to run it, when to skip it, nutrient and pH conditions,
