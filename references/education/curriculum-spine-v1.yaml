    sources_private: [aoc_1_5_grapevine_culture_a, aoc_1_6_grapevine_culture_b, aoc_1_8_improving_grape_quality]
    sources_public_ref: [adelaide_viticult_3021wt, lincoln_wine_301, csu_vit212]
    citations_bibliographic: [coombe_iland_visc_vol2_practices]

  - id: L2.4
    slug: ripeness-harvest-decisions
    title: "Ripeness — the highest-leverage decision of your year"
    level: 2
    wbs: [D2]
    reading_min: 5
    aim: >
      Baumé/Brix, TA, pH, phenolic ripeness, botrytis pressure — how the
      inputs to a harvest call combine, and how to weigh them for the wine
