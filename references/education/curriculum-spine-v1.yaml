    sources_private: [morewine_bible_red_ch7, aoc_2_3_wine_making_process]
    sources_public_ref: [adelaide_oenology_2503wt, adelaide_oenology_3047wt]
    citations_bibliographic: [boulton_ppw_ch3]

  - id: L2.6
    slug: yeast-selection-inoculation
    title: "Yeast — the decision that flavours everything"
    level: 2
    wbs: [D4]
    reading_min: 5
    aim: >
      Wild vs inoculated, strain selection, nutrition, rehydration protocol
