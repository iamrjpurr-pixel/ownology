    sources_private: [morew_yeast_hydration, morew_yeast_pairing, aoc_2_4_yeasts]
    sources_public_ref: [csu_wsc318, adelaide_oenology_2501wt]
    citations_bibliographic: [rgayon_handbook_v1_ch4]

  - id: L2.7
    slug: fermentation-management
    title: "Fermentation management — heat, extract, oxygen"
    level: 2
    wbs: [D4]
    reading_min: 6
    aim: >
      Temperature control, cap management, oxygen ingress, nutrient
      timing, stuck-ferment prevention — running the ferment as an active
