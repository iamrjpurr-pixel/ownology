# Pytest config for the Ownology backend regression suite.
#
# Usage:
#   cd /app/backend/tests && pytest .                 # local (localhost:8001)
#   API_URL=https://ownology.ai pytest .              # against production
#   API_URL=<preview-url> pytest .                    # against preview
#
# All tests read the target host from $API_URL (or $REACT_APP_BACKEND_URL as
# a fallback for a handful of iter18/19/20 files). No conftest.py needed —
# tests are intentionally self-contained so any one file can be copy-pasted
# into a debug session and run against any environment.
[pytest]
testpaths = .
addopts = -q --tb=short
markers =
    smoke: fast pre-deploy check (test_smoke.py) — always run before shipping
    slow: hits LLM / external APIs — allow >5s per test
